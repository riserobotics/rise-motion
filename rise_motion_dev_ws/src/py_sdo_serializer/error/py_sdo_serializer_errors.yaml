---
# prefix for ui and log -> full code e.g = [TPL-101]
start_code: PYS              

# Build-time errors
# Generates exception classes (check docs) for build-time
# USE THESE FOR EXCEPTIONS, OTHERWISE FLAKE8 ERRORS! (and better doc)
build:
  - name: BuildTimeError                                   # Name of the exception in code
    code: "001"                                            # 3 digit code (for doc and UI)
    description: "What went wrong with '{placeholder}'"   # use {placeholders} -> can be filled in code that raises the error
    remedy: "What the user should do about it"            # What user should do to fix

  - name: MyBuildError
    code: "002"
    description: "What went wrong with '{placeholder}' at build time"
    remedy: "What the user should do about it"

  - [ ... ]

# Runtime errors 
# Generates functions for raising, logging and publishing runtime errors for error_monitor
runtime:

  - name: ValueToDeserializeWrongSize
    code: "101"
    description: "EtherCAT data type '{placeholder}' is size '{placeholder}' bytes, got something size '{placeholder}' at runtime."
    remedy: "Check health of EtherCAT connection between this device and motor driver and how data type got from sdo_read to deserialize()"

    # 0 - Warning (ROS_WARN, log)
    # 1 - Error   (ROS_ERROR, log, sets this node to failsafe, UI can acknowledge and clear)
    # 2 - Critical (ROS_FATAL, log, sets ALL nodes to failsafe, UI CANNOT acknowledge -> hard reset)  
    severity: 1

    # Debouncer -> same error will not be published/logged more than once inside this window
    # DONT FORGET TO SET THIS WHEN CALLED IN LOOPS --> SPAMS MESSAGES OTHERWISE
    debounce_s: 0 

    # Time until auto clear of error (if error does not re-occur)
    # 0 -> error latches until cleared or acknowledged
    auto_clear_s: 30.0

    # raise severity when error fires too often
    escalate:
      count: 5               # occurrences inside the window
      window_s: 10.0         # time window
      to: 2                 # severity applied once the threshold is hit

    # Error handler functions (maybe?)
    # will generate a folder "rise_ws/src/package_name/error_handlers" with templates for the error handler functions
    # Error_monitor will call these functions when the error is raised
    # error_handler:
    #   - name: nothingYouCanDo
    #     description: "I don't think this error can be handled."
    #     args:
    #       - name: parameter_a
    #         type: int

    #   - name: restart_node
    #     description: "Restart the node"


  - name: "ValueToSerializeWrongType"
    code: "102"
    description: "Serialize function '{placeholder}' expected variable of type '{placeholder}' and got '{placeholder}' at runtime"
    remedy: "Check your code for reason why wrong data type was given to serialize function."
    severity: 1
    debounce_s: 0
    auto_clear_s: 30.0

    escalate:
      count: 5
      window_s: 10.0
      to: 2
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"

  - name: "ValueToDeserializeWrongType"
    code: "103"
    description: "Deserialize function expected 'serialized_value' of type 'list[int]' and got '{placeholder}' at runtime"
    remedy: "Check your code for reason why wrong data type was given to deserialize function; serialized_value must be a list[int]."
    severity: 1
    debounce_s: 0
    auto_clear_s: 30.0
 
    escalate:
      count: 5
      window_s: 10.0
      to: 2
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"
 
  - name: "TimeOfDayMillisecondsOverflow"
    code: "104"
    description: "Number of milliseconds since midnight '{placeholder}' exceeds the maximum representable value for EtherCAT TIME_OF_DAY at runtime"
    remedy: "Check the source of the ms-since-midnight value being serialized. The 4 most significant bits of this field must be 0 per ETG.1020, i.e. the value must not exceed 2^28 - 1."
    severity: 1
    debounce_s: 0
    auto_clear_s: 30.0
 
    escalate:
      count: 5
      window_s: 10.0
      to: 2
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"


  - name: "NoEthercatTypeWithGivenIndex"
    code: "110"
    description: "There is no EtherCAT datatype with index '{placeholder}'"
    remedy: "Be aware that this is not the index of entries in a device's object dictionary, but the index of the EtherCAT datatype set in the ETG.1000.6 and ETG.1020 standards. Or check for typos in the index."
    severity: 0
    debounce_s: 0
    auto_clear_s: 30.0

    escalate:
      count: 5
      window_s: 10.0
      to: 1
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"

  - name: "NoEthercatTypeWithGivenName"
    code: "111"
    description: "There is no EtherCAT datatype with name '{placeholder}'"
    remedy: "Check for typos in the name."
    severity: 0
    debounce_s: 0
    auto_clear_s: 30.0

    escalate:
      count: 5
      window_s: 10.0
      to: 1
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"

  - name: "NoEthercatTypeWithGivenBaseDataType"
    code: "112"
    description: "There is no EtherCAT datatype with base data type '{placeholder}'"
    remedy: "Check for typos in the base data type."
    severity: 0
    debounce_s: 0
    auto_clear_s: 30.0

    escalate:
      count: 5
      window_s: 10.0
      to: 1
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"

  - name: "NoEthercatTypeSpecified"
    code: "113"
    description: "Provide at least one of: index, name, base_data_type"
    remedy: "Check your code for reason why no EtherCAT datatype was specified."
    severity: 0
    debounce_s: 0
    auto_clear_s: 30.0

    escalate:
      count: 5
      window_s: 10.0
      to: 1
    # error_handler:
    #   - name: restart_node
    #     description: "Restart the node"

  - [ ... ]
